<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#090d18">
<title>FileDost - Your Video Space</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#090d18;color:#f5f7ff;font-family:Arial,sans-serif}
header{height:72px;padding:0 6%;display:flex;align-items:center;justify-content:space-between;background:#101727;border-bottom:1px solid #263047;position:sticky;top:0;z-index:5}
.logo{font-size:25px;font-weight:800;color:#fff}
.logo span{color:#6d8cff}
.upload-top{background:#526dff;color:white;padding:12px 18px;border-radius:10px;text-decoration:none;font-weight:bold}
main{max-width:1150px;margin:auto;padding:35px 20px}
.hero{padding:42px 25px;border-radius:22px;background:linear-gradient(120deg,#182b57,#29205a,#151b36);text-align:center}
.hero h1{font-size:clamp(30px,6vw,48px);margin:0 0 12px}
.hero p{color:#c3cbe0;font-size:16px;line-height:1.6}
.search{max-width:560px;margin:25px auto 0;display:flex;gap:8px}
.search input{flex:1;min-width:0;padding:15px;border:1px solid #3b4968;background:#101827;color:white;border-radius:11px;font-size:15px;outline:none}
.search button,.upload-button{border:0;background:#637cff;color:white;padding:14px 20px;border-radius:10px;font-weight:bold}
.section{margin-top:38px}
.section-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px}
.section h2{font-size:23px;margin:0}
.muted{color:#9ba8c2;font-size:13px}
.upload-box{background:#111a2b;border:1px solid #263650;padding:22px;border-radius:16px;margin-top:25px}
.upload-box h2{margin:0 0 8px;font-size:21px}
.upload-box p{color:#aab5ca;font-size:14px}
input[type=file]{width:100%;padding:13px;background:#0b1220;border:1px dashed #52617d;color:#cbd5e1;border-radius:10px;margin:12px 0}
.upload-button{width:100%;font-size:15px;cursor:pointer}
#message{font-size:14px;color:#aabaff;margin-top:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(245px,1fr));gap:18px}
.video-card{background:#121b2c;border:1px solid #25334c;border-radius:15px;overflow:hidden}
.video-card video{width:100%;aspect-ratio:16/9;background:#05070c;display:block}
.video-info{padding:14px}
.video-info h3{font-size:16px;margin:0 0 12px;overflow-wrap:anywhere}
.video-actions{display:flex;gap:9px}
.video-actions a{flex:1;text-align:center;text-decoration:none;padding:10px;border-radius:8px;background:#26385e;color:white;font-size:13px}
.empty{padding:35px;text-align:center;color:#98a6c1;background:#111a2b;border-radius:14px;grid-column:1/-1}
footer{text-align:center;padding:30px 15px;color:#7887a3;border-top:1px solid #202b40;margin-top:50px;font-size:13px}
@media(max-width:550px){header{padding:0 16px}.logo{font-size:21px}.upload-top{padding:10px 12px;font-size:13px}main{padding:22px 14px}.hero{padding:35px 16px}.search button{padding:12px}.section h2{font-size:20px}}
</style>
</head>
<body>
<header>
 <div class="logo">File<span>Dost</span></div>
 <a class="upload-top" href="#upload">＋ Upload Video</a>
</header>
<main>
 <section class="hero">
  <h1>Your Videos. Your Space.</h1>
  <p>Upload, watch and share your videos with FileDost.</p>
  <div class="search">
   <input id="searchInput" type="search" placeholder="Search videos...">
   <button onclick="searchVideos()">Search</button>
  </div>
 </section>

 <section class="upload-box" id="upload">
  <h2>Upload Your Video</h2>
  <p>Select a video from your device to upload it.</p>
  <form id="uploadForm">
   <input id="videoInput" type="file" accept="video/*" required>
   <button class="upload-button" type="submit">Upload Video</button>
  </form>
  <div id="message"></div>
 </section>

 <section class="section">
  <div class="section-head">
   <h2>All Videos</h2>
   <span class="muted" id="videoCount">Loading...</span>
  </div>
  <div class="grid" id="videoGrid">
   <div class="empty">Loading videos...</div>
  </div>
 </section>
</main>
<footer>© 2026 FileDost · Your Videos, Your Space</footer>

<script>
let allVideos=[];

async function loadVideos(){
 const grid=document.getElementById('videoGrid');
 try{
  const response=await fetch('/api/videos');
  if(!response.ok) throw new Error('Could not load videos');
  allVideos=await response.json();
  renderVideos(allVideos);
  openRequestedVideo();
 }catch(error){
  grid.innerHTML='<div class="empty">Videos could not be loaded. Please refresh.</div>';
  document.getElementById('videoCount').textContent='';
 }
}

function renderVideos(videos){
 const grid=document.getElementById('videoGrid');
 document.getElementById('videoCount').textContent=videos.length+' videos';
 if(!videos.length){
  grid.innerHTML='<div class="empty">No videos uploaded yet. Be the first to upload!</div>';
  return;
 }
 grid.innerHTML=videos.map(video=>`
  <article class="video-card" id="video-${video.id}">
   <video controls preload="metadata" src="${video.url}"></video>
   <div class="video-info">
    <h3>${escapeHTML(video.title||'Untitled video')}</h3>
    <div class="video-actions">
     <a href="${video.url}" download>Download</a>
     <a href="#" onclick="copyVideoLink('${video.id}');return false">Copy Link</a>
     <a href="#" onclick="shareVideo('${video.id}');return false">Share</a>
    </div>
   </div>
  </article>
 `).join('');
}

function getWatchLink(id){
 return location.origin+'/?v='+encodeURIComponent(id);
}

async function copyVideoLink(id){
 const url=getWatchLink(id);
 try{
  await navigator.clipboard.writeText(url);
  alert('FileDost video link copied!');
 }catch(e){
  const input=document.createElement('textarea');
  input.value=url;
  document.body.appendChild(input);
  input.select();
  document.execCommand('copy');
  input.remove();
  alert('FileDost video link copied!');
 }
}

async function shareVideo(id){
 const url=getWatchLink(id);
 try{
  if(navigator.share){
   await navigator.share({title:'Watch on FileDost',url});
  }else{
   await copyVideoLink(id);
  }
 }catch(e){}
}

function openRequestedVideo(){
 const id=new URLSearchParams(location.search).get('v');
 if(!id) return;
 const card=document.getElementById('video-'+id);
 if(card){
  card.scrollIntoView({behavior:'smooth',block:'center'});
 }
}
function escapeHTML(value){
 return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function searchVideos(){
 const term=document.getElementById('searchInput').value.toLowerCase().trim();
 renderVideos(allVideos.filter(v=>(v.title||'').toLowerCase().includes(term)));
}
document.getElementById('searchInput').addEventListener('input',searchVideos);

async function shareVideo(url){
 try{
  if(navigator.share) await navigator.share({title:'Watch on FileDost',url});
  else{await navigator.clipboard.writeText(url);alert('Video link copied!');}
 }catch(e){}
}


const uploadForm = document.getElementById('uploadForm');

const progressStyle = document.createElement('style');
progressStyle.textContent = `
#fdProgress{display:none;background:#111a2b;padding:16px;border-radius:13px;margin:15px 0;color:white}
#fdProgressBar{height:12px;background:#26344d;border-radius:20px;overflow:hidden;margin:12px 0}
#fdProgressFill{height:100%;width:0%;background:#718cff;transition:width .2s}
#fdToast{display:none;position:fixed;top:15px;left:5%;width:90%;z-index:99999;padding:15px;background:#172544;color:white;border:1px solid #718cff;border-radius:12px;text-align:center}
`;
document.head.appendChild(progressStyle);

uploadForm.insertAdjacentHTML('afterend', `
<div id="fdProgress">
 <b id="fdProgressText">Uploading: 0%</b>
 <div id="fdProgressBar"><div id="fdProgressFill"></div></div>
 <span id="fdProgressSize">0 MB / 0 MB</span>
</div>
<div id="fdToast"></div>
`);

function fdNotify(message, success) {
 const toast = document.getElementById('fdToast');
 toast.textContent = message;
 toast.style.display = 'block';
 toast.style.borderColor = success ? '#35c98b' : '#ff6868';
 setTimeout(() => toast.style.display = 'none', 4000);
}

uploadForm.addEventListener('submit', function(e) {
 e.preventDefault();

 const input = document.getElementById('videoInput');
 const message = document.getElementById('message');

 if (!input.files.length) {
  message.textContent = 'Please select a video.';
  fdNotify('Please select a video.', false);
  return;
 }

 const file = input.files[0];
 const data = new FormData();
 data.append('video', file);

 const progress = document.getElementById('fdProgress');
 const fill = document.getElementById('fdProgressFill');
 const percentText = document.getElementById('fdProgressText');
 const sizeText = document.getElementById('fdProgressSize');
 const mb = n => (n / 1048576).toFixed(2);

 progress.style.display = 'block';
 fill.style.width = '0%';
 percentText.textContent = 'Uploading: 0%';
 sizeText.textContent = '0 MB / ' + mb(file.size) + ' MB';
 message.textContent = 'Uploading... Please wait.';

 const xhr = new XMLHttpRequest();
 xhr.open('POST', '/api/upload');

 xhr.upload.onprogress = function(event) {
  if (event.lengthComputable) {
   const percent = Math.min(100, Math.round(event.loaded / event.total * 100));
   fill.style.width = percent + '%';
   percentText.textContent = 'Uploading: ' + percent + '%';
   sizeText.textContent = mb(Math.min(event.loaded, file.size)) + ' MB / ' + mb(file.size) + ' MB';
  }
 };

 xhr.onload = async function() {
  let result = {};
  try { result = JSON.parse(xhr.responseText); } catch (e) {}

  if (xhr.status >= 200 && xhr.status < 300) {
   fill.style.width = '100%';
   percentText.textContent = 'Uploading: 100%';
   sizeText.textContent = mb(file.size) + ' MB / ' + mb(file.size) + ' MB';
   message.textContent = 'Video uploaded successfully!';
   fdNotify('Video upload successful!', true);
   input.value = '';
   const fileName = document.getElementById('fileName');
   if (fileName) fileName.textContent = 'No video selected';
   try { await loadVideos(); } catch (e) {}
  } else {
   percentText.textContent = 'Upload failed';
   message.textContent = result.message || 'Upload failed';
   fdNotify(message.textContent, false);
  }
 };

 xhr.onerror = function() {
  percentText.textContent = 'Upload failed';
  message.textContent = 'Network error. Please try again.';
  fdNotify(message.textContent, false);
 };

 xhr.send(data);
});

loadVideos();
</script>
</body>
</html>
